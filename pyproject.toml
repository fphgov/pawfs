[tool.poetry]
name = "pawfs"
version = "0.1.0"
description = "Utility for accessing files on sharepoint / other places from our pipelines."
authors = ["partvishegy <venczeli.jozsef@budapest.hu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
dotenv = "^0.9.9"
azure-identity = "^1.23.0"
python-dotenv = "^1.1.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
