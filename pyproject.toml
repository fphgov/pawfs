[tool.poetry]
name = "pawfs"
version = "0.1.0"
description = "Utility for accessing files on sharepoint / other places from our pipelines."
authors = ["partvishegy <venczeli.jozsef@budapest.hu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
dotenv = "^0.9.9"
azure-identity = "1.15.0"
python-dotenv = "1.0.0"
azure-core = "1.29.5"
certifi = "2023.7.22"
cffi = "1.16.0"
charset-normalizer = "3.3.2"


[tool.poetry.group.dev.dependencies]
pandas = "^2.3.0"
openpyxl = "^3.1.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
