[tool.poetry]
name = "pawfs"
version = "0.1.0"
description = "Utility for accessing files on sharepoint / other places from our pipelines."
authors = ["partvishegy <venczeli.jozsef@budapest.hu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
dotenv = "^0.9.9"
azure-identity = "1.16.1"
python-dotenv = "1.0.0"
azure-core = "1.29.5"
certifi = "2023.7.22"
cffi = "1.16.0"
charset-normalizer = "3.3.2"
cryptography = "41.0.5"
idna = "3.4"
msal-extensions = "1.0.0"
msal = "1.24.1"
pyjwt = "2.8.0"
urllib3 = "1.26.18"
six = "1.16.0"
requests = "2.31.0"
pycparser = "2.21"
portalocker = "2.8.2"
typing-extensions = "4.8.0"


[tool.poetry.group.dev.dependencies]
pandas = "^2.3.0"
openpyxl = "^3.1.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
