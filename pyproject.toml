[project]
name = "pawfs"
version = "0.1.0"
description = "Utility for accessing files on sharepoint / other places from our pipelines."
readme = "README.md"
# No upper bound: "<=3.14" means 3.14.0 only (PEP 440) and broke pip installs on 3.14.x.
requires-python = ">=3.10"
authors = [
  { name = "partvishegy", email = "venczeli.jozsef@budapest.hu" }
]

dependencies = [
  "azure-identity>=1.15.0,<2.0.0",
  "azure-core>=1.29.5,<2.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "msal>=1.24.1,<2.0.0",
  "msal-extensions>=1.0.0,<2.0.0",
  "pyjwt>=2.8.0,<3.0.0",
  "requests>=2.31.0,<3.0.0",
  "portalocker>=2.8.2,<3.0.0",
  "pandas>=2.3.0,<3.0.0",
  "openpyxl>=3.1.5,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"