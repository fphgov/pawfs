[tool.poetry]
name = "pawfs"
version = "0.1.0"
description = "Utility for accessing files on sharepoint / other places from our pipelines."
authors = ["partvishegy <venczeli.jozsef@budapest.hu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
msal = "^1.32.3"
office365-rest-python-client = "^2.6.2"
dotenv = "^0.9.9"
azure-identity = "^1.23.0"
msgraph-core = "^1.3.3"
python-dotenv = "^1.1.0"
msgraph-sdk = "^1.31.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
